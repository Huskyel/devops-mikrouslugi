services:
  web:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: aplikacja-web
    ports:
      - "5000:5000"
    environment:
      - APP_VERSION=${APP_VERSION:-dev}
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: aplikacja-redis
    ports:
      - "6379:6379"
